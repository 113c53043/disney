name: Test Discord Everyone

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord @everyone test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -f \
            -H "Content-Type: application/json" \
            -d '{
              "content":"@everyone 🚨 東武接駁車有位置了！【測試通知】",
              "allowed_mentions":{"parse":["everyone"]}
            }' \
            "$DISCORD_WEBHOOK_URL"
            
