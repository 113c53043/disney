name: Test Discord Notification

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord test message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          curl -f \
            -H "Content-Type: application/json" \
            -d '{"content":"✅ 東武巴士空位監控：Discord 通知測試成功！"}' \
            "$DISCORD_WEBHOOK_URL"
